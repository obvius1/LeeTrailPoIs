<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Peaks POIs">
  <meta name="theme-color" content="#1a1a2e">

  <title>Peaks of the Balkans — Offline POIs</title>

  <link rel="manifest" href="manifest.webmanifest?v=3">
  <link rel="stylesheet" href="leaflet.css">
  <link rel="stylesheet" href="style.css">

  <!-- iOS-iconen (optioneel — voeg icon-*.png toe in web/ voor volledig PWA-icoon) -->
  <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

  <!-- Offline-banner -->
  <div id="offline-banner">⚡ Je bent offline — alle gecachede data is beschikbaar</div>

  <!-- Header -->
  <header id="header">
    <h1>⛰ Peaks <span>POIs</span></h1>

    <!-- Zoekbalk -->
    <div id="search-wrap">
      <span id="search-icon">🔍</span>
      <input id="search" type="search" placeholder="Zoek naam of trefwoord in reviews…" autocomplete="off" autocorrect="off">
    </div>

    <!-- Weergave-tabs -->
    <div id="view-tabs">
      <button class="view-tab active" data-view="list">☰ Lijst</button>
      <button class="view-tab" data-view="map">🗺 Kaart</button>
    </div>

    <!-- Categorie-filters (enkel in lijstweergave) -->
    <div id="filters" role="group" aria-label="Filter op categorie">
      <button class="chip active" data-cat="all">Alles</button>
      <button class="chip" data-cat="accommodation">🏕 Slaap</button>
      <button class="chip" data-cat="water">💧 Water</button>
      <button class="chip" data-cat="food">🍽 Eten</button>
      <button class="chip" data-cat="sights">🏔 Zien</button>
      <button class="chip chip-star" data-cat="starred">★ Favorieten</button>
      <button class="chip chip-note" data-cat="noted">📝 Notities</button>
    </div>
  </header>

  <!-- Verbindingsprompt (op mobiele data) -->
  <div id="cache-prompt" style="display:none">
    <span id="cache-prompt-text">📱 Je bent op mobiele data. Kaartdata (~307 MB) nog niet gecached.</span>
    <div id="cache-prompt-btns">
      <button id="cache-prompt-yes">Toch downloaden</button>
      <button id="cache-prompt-no">Later</button>
    </div>
  </div>

  <!-- Cache-voortgang (zichtbaar tijdens download of bij heropenen) -->
  <div id="cache-status" style="display:none">
    <div id="cache-status-bar"><div id="cache-status-fill"></div></div>
    <span id="cache-status-text"></span>
  </div>

  <!-- Statistieken -->
  <div id="stats">Laden…</div>

  <!-- POI-lijst -->
  <main>
    <!-- Laad-indicator -->
    <div id="loading">
      <div class="spinner"></div>
      <span>Data laden…</span>
    </div>

    <!-- Lijst -->
    <div id="list" role="list"></div>

    <!-- Geen resultaten -->
    <div id="no-results" aria-live="polite">
      <div style="font-size:2rem">🔍</div>
      <p>Geen locaties gevonden voor deze filter.</p>
    </div>
  </main>

  <!-- Detail-weergave (wordt dynamisch gevuld door app.js) -->
  <div id="detail" role="dialog" aria-modal="true" aria-label="Locatie detail"></div>

  <!-- Kaartweergave -->
  <div id="map-view" style="display:none">
    <div id="map"></div>
  </div>

  <!-- GPS-knop -->
  <button id="locate-btn" aria-label="Toon locaties dicht bij mij">📍</button>

  <!-- Lightbox foto-viewer -->
  <div id="lightbox" role="dialog" aria-modal="true" aria-label="Foto volledig scherm">
    <button id="lightbox-close" onclick="closeLightbox()" aria-label="Sluiten">✕</button>
    <button id="lightbox-prev" aria-label="Vorige foto">‹</button>
    <img id="lightbox-img" alt="">
    <button id="lightbox-next" aria-label="Volgende foto">›</button>
    <div id="lightbox-counter"></div>
    <div id="lightbox-date" class="hidden"></div>
  </div>

  <script src="leaflet.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
