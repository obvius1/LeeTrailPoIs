name: Deploy naar GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: # ook handmatig te starten via de Actions-tab

permissions:
  contents: read
  pages: write
  id-token: write

# Voorkom dat twee deploys tegelijk draaien
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configureer GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload web/ als Pages artifact
        uses: actions/upload-pages-artifact@v6
        with:
          path: web/

      - name: Deploy naar GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
